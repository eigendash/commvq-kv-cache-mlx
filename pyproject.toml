[project]
name = "commvq"
version = "0.1.0"
description = "Toy-scale MLX implementation of CommVQ: additive KV cache quantization with a RoPE-commutative codebook"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
